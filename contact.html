<!DOCTYPE html>
<html class="dark" lang="en">
    <head>
        <meta charset="utf-8"/>
        <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
        <title>Alex Doe - Contact Me</title>
        <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Playfair+Display:wght@700&amp;display=swap" rel="stylesheet"/>
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
        <script>
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        colors: {
                            primary: "#3B82F6",
                            "background-light": "#F3F4F6",
                            "background-dark": "#111827",
                        },
                        fontFamily: {
                            sans: ['Inter', 'sans-serif'],
                            display: ['Playfair Display', 'serif'],
                        },
                        borderRadius: {
                            DEFAULT: "0.5rem",
                        },
                    },
                },
            };
        </script>
        <style>
            .project-card {
                transition: transform 0.3s ease, box-shadow 0.3s ease;
            }
            .project-card:hover {
                transform: translateY(-5px);
                box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            }
            .form-input {
                background-color: transparent;
                border-width: 1px;
                border-color: #374151;
            }
            .dark .form-input {
                border-color: #4B5563;
            }
            .form-input:focus {
                outline: 2px solid transparent;
                outline-offset: 2px;
                --tw-ring-inset: var(--tw-empty,);
                --tw-ring-offset-width: 0px;
                --tw-ring-offset-color: #fff;
                --tw-ring-color: #3B82F6;
                --tw-ring-offset-shadow: var(--tw-ring-inset) 0 0 0 var(--tw-ring-offset-width) var(--tw-ring-offset-color);
                --tw-ring-shadow: var(--tw-ring-inset) 0 0 0 calc(2px + var(--tw-ring-offset-width)) var(--tw-ring-color);
                box-shadow: var(--tw-ring-offset-shadow), var(--tw-ring-shadow), var(--tw-shadow, 0 0 #0000);
                border-color: #3B82F6;
            }
        </style>
    </head>

    <body class="bg-background-light dark:bg-background-dark text-gray-800 dark:text-gray-200 font-sans antialiased">

        <div class="flex min-h-screen">
            <div id="nav-placeholder"></div>
                <main class="w-3/4 lg:w-4/5 xl:w-5/6 ml-auto p-8 lg:p-12">
                    <div class="max-w-7xl mx-auto">
                        <header class="mb-12">
                            <h1 class="text-5xl md:text-6xl font-display font-bold">Contact Me</h1>
                            <p class="mt-4 text-lg text-gray-600 dark:text-gray-400">I'm open to new opportunities and collaborations. Let's connect!</p>
                        </header>

                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-12">
                            <div class="lg:col-span-2">
                                <h2 class="text-3xl font-display font-bold mb-6">Send a Message</h2>
                                <form action="#" class="space-y-6" method="POST">
                                    <div>
                                        <label class="block text-sm font-medium text-gray-500 dark:text-gray-400" for="name">Full Name</label>
                                        <div class="mt-1">
                                            <input autocomplete="name" class="form-input block w-full rounded-md shadow-sm py-3 px-4 text-gray-900 dark:text-gray-100 dark:bg-gray-800/50 focus:ring-primary focus:border-primary" id="name" name="name" type="text"/>
                                        </div>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-500 dark:text-gray-400" for="email">Email Address</label>
                                        <div class="mt-1">
                                            <input autocomplete="email" class="form-input block w-full rounded-md shadow-sm py-3 px-4 text-gray-900 dark:text-gray-100 dark:bg-gray-800/50 focus:ring-primary focus:border-primary" id="email" name="email" type="email"/>
                                        </div>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-500 dark:text-gray-400" for="subject">Subject</label>
                                        <div class="mt-1">
                                            <input class="form-input block w-full rounded-md shadow-sm py-3 px-4 text-gray-900 dark:text-gray-100 dark:bg-gray-800/50 focus:ring-primary focus:border-primary" id="subject" name="subject" type="text"/>
                                        </div>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-500 dark:text-gray-400" for="message">Message</label>
                                        <div class="mt-1">
                                            <textarea class="form-input block w-full rounded-md shadow-sm py-3 px-4 text-gray-900 dark:text-gray-100 dark:bg-gray-800/50 focus:ring-primary focus:border-primary" id="message" name="message" rows="4"></textarea>
                                        </div>
                                    </div>
                                    <div>
                                        <button class="inline-flex justify-center py-3 px-6 border border-transparent shadow-sm text-base font-medium rounded-md text-white bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary dark:focus:ring-offset-background-dark transition-colors" type="submit">
                                            Submit
                                        </button>
                                    </div>
                                </form>
                            </div>
                            <div class="space-y-8">
                                <div class="flex justify-center">
                                    <img alt="Alex Doe Professional Photo" class="h-48 w-48 rounded-full object-cover shadow-lg" src="headshot.jpeg"/>
                                </div>
                                <div>
                                    <h2 class="text-2xl font-display font-bold mb-4">Contact Details</h2>
                                    <div class="space-y-4">
                                        <div class="flex items-center space-x-3">
                                            <span class="material-symbols-outlined text-primary text-2xl">mail</span>
                                            <a class="text-gray-600 dark:text-gray-400 hover:text-primary dark:hover:text-primary transition-colors" href="mailto:malia.wakeshoajwang@gmail.com">Click to Email Me</a>
                                        </div>
                                        <div class="flex items-center space-x-3">
                                            <span class="material-symbols-outlined text-primary text-2xl">location_on</span>
                                            <span class="text-gray-600 dark:text-gray-400">London, UK</span>
                                        </div>
                                    </div>
                                </div>
                                <div>
                                    <h2 class="text-2xl font-display font-bold mb-4">Find me on</h2>
                                    <div class="flex space-x-4">
                                        <a class="text-gray-500 dark:text-gray-400 hover:text-primary dark:hover:text-primary transition-colors" href="https://github.com/MaliaWakeshoAjwang" target="_blank" rel="noopener noreferrer">
                                            <svg aria-hidden="true" class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path clip-rule="evenodd" d="M12 2C6.477 2 2 6.477 2 12c0 4.286 2.863 7.92 6.783 9.24.5.092.682-.217.682-.482 0-.237-.009-.868-.014-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.03-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.378.203 2.398.1 2.65.64.7 1.028 1.595 1.028 2.688 0 3.848-2.338 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.578.688.482A10.001 10.001 0 0022 12c0-5.523-4.477-10-10-10z" fill-rule="evenodd"></path></svg>
                                        </a>
                                        <a class="text-gray-500 dark:text-gray-400 hover:text-primary dark:hover:text-primary transition-colors" href="https://www.instagram.com/mazwakes/" target="_blank" rel="noopener noreferrer">
                                            <svg aria-hidden="true" class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M7.75 2h8.5A5.75 5.75 0 0 1 22 7.75v8.5A5.75 5.75 0 0 1 16.25 22h-8.5A5.75 5.75 0 0 1 2 16.25v-8.5A5.75 5.75 0 0 1 7.75 2zm0 1.5A4.25 4.25 0 0 0 3.5 7.75v8.5A4.25 4.25 0 0 0 7.75 20.5h8.5A4.25 4.25 0 0 0 20.5 16.25v-8.5A4.25 4.25 0 0 0 16.25 3.5h-8.5zm4.25 3.25a5.25 5.25 0 1 1 0 10.5 5.25 5.25 0 0 1 0-10.5zm0 1.5a3.75 3.75 0 1 0 0 7.5 3.75 3.75 0 0 0 0-7.5zm5.5-.875a.875.875 0 1 1 0 1.75.875.875 0 0 1 0-1.75z"></path></svg>
                                        </a>
                                        <a class="text-gray-500 dark:text-gray-400 hover:text-primary dark:hover:text-primary transition-colors" href="https://www.linkedin.com/in/malia-wakesho-ajwang/" target="_blank" rel="noopener noreferrer">
                                            <svg aria-hidden="true" class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"></path></svg>
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <script>
            document.documentElement.classList.add('dark');

            fetch("nav.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("nav-placeholder").innerHTML = data;
                // Highlight current page after nav is inserted
                const currentPage = window.location.pathname.split("/").pop() || "index.html";
                document.querySelectorAll(".nav-link").forEach(link => {
                    const linkPage = link.getAttribute("href");
                    if (linkPage === currentPage) {
                        link.classList.add("text-primary", "dark:text-primary");
                        link.classList.remove("text-gray-600", "dark:text-gray-400");
                    }
                });
            })
            .catch(err => console.error("Error loading navigation:", err));

        </script>

    </body>

</html>
